[workspace]
members = [
    "crates/protocol",
    "crates/bridge",
    "crates/companion",
]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
ctab-web-protocol = { path = "crates/protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
